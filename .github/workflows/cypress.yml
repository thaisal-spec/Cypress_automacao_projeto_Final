name: Cypress Tests

on: [push]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/1-getting-started/automation-exercise.cy.js

      - name: Salvar Relatorio Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: cypress/reports